
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <p class="eyebrow">A LITTLE INSPIRATION</p>

        <h1>Words to <span>live by.</span></h1>

        <p class="subtitle">
            Find a thought that inspires you.
        </p>

        <section class="quote-card" aria-live="polite">
            <div class="quote-mark">“</div>

            <p id="quote-text">
                Your next chapter can begin with one small step.
            </p>

            <div class="divider"></div>

            <p id="quote-author">— Anonymous</p>
        </section>

        <div class="actions">
            <button id="new-quote" type="button">
                ✦ New Quote
            </button>

            <button id="copy-quote" type="button">
                Copy Quote
            </button>
        </div>

        <p id="status" role="status"></p>

        <footer>
            Made with curiosity &amp; code.
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
